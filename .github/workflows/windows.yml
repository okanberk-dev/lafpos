# Kafenin kasa bilgisayarı Windows: kurulum dosyası (NSIS) Windows'ta derlenir ve paket kafeye gidecek ikililerle
# (paketteki Node 24 ve better-sqlite3'ün Windows ikilisi) bekçi üzerinden açılıp denenir: göçler, giriş, açılış
# verisi, arayüz, bellek sınırı, ayar değişince yeniden başlama, düzgün kapanış (scripts/kasa/windows/kurulum/derle.mjs).
# Linux denetiminden (ci.yml) ayrı; PR'da yalnız kasaya giden dosyalar değişince: özel depoda Windows dakikası iki kat
# sayılır (docs/05-KASA-BILGISAYARI.md). Sunucu ortak kodu (shared/) pakete gömer; ayar örneği .env.example'dan
# üretilir. Gerekirse Actions › Windows kurulumu › Run workflow ile elle.
# main'e her push'ta kurulum dosyası GitHub Release olarak yayımlanır (AsilPOS-Kurulum.exe ve .sha256, sabit adlarla;
# sürüm package.json'ın major.minor'u + çalıştırma no): sahip ilk kurulumu Releases'tan indirir. Sonraki sürümleri
# kasa kendisi alır (Vercel'deki güncelleme kanalı, scripts/kasa/windows/kurulum/kanal.mjs); bu iş anahtar istemez.
name: Windows kurulumu

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'scripts/kasa/windows/**'
      - 'server/**'
      - 'shared/**'
      - 'drizzle/**'
      - '.env.example'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

# PR'da yeni push eski koşuyu iptal eder; main'deki koşu (Release yayımlar) yarıda kesilmez, sıraya girer
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      # Depo LF ile gelsin (Windows runner'ı varsayılan CRLF'e çevirir); .bat ve .ps1 .gitattributes'la CRLF kalır
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # derle.mjs makensis'i PATH'te ya da Program Files\NSIS'te arar; imajda yoksa kurulur
      - name: NSIS
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") -and -not (Test-Path "$env:ProgramFiles\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
      # İndirilen Node zip'i ve better-sqlite3 ikilisi: npm ci node_modules'u sildiği için ondan sonra geri gelir
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/asilpos-windows
          key: asilpos-windows-${{ hashFiles('scripts/kasa/windows/kurulum/derle.mjs', 'package-lock.json') }}
      # Kurulumun sürümü: package.json'ın major.minor'u + çalıştırma no (Uygulamalar listesinde görünür)
      - name: Sürüm
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version.Split('.')
          "ASILPOS_SURUM=$($v[0]).$($v[1]).${{ github.run_number }}" >> $env:GITHUB_ENV
      - run: npm run kurulum:windows
      # Gerçek kurulum: sessiz kurulum (/S), görevle açılan sunucunun sağlığı, yerel kanaldan bir sonraki derlemeye
      # güncelleme (Node değişimi dahil: 75 kodu, app ↔ app.eski, node.yeni) ve bozuk derlemede geri dönüş
      # (scripts/kasa/windows/kurulum/ci-kurulum.mjs). Yayımlamadan önce: kurulamayan dosya Releases'a çıkmaz
      - name: Kur, güncelle, geri dön (gerçek Windows)
        timeout-minutes: 25
        run: |
          $p = Start-Process "dist/windows/AsilPOS-Kurulum-$env:ASILPOS_SURUM.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Kurulum $($p.ExitCode) koduyla bitti" }
          node scripts/kasa/windows/kurulum/ci-kurulum.mjs
      # Yalnız main'e push'ta: sabit adlarla yayımla, son 10 sürüm kalır
      - name: Sürümü yayımla
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item "dist/windows/AsilPOS-Kurulum-$env:ASILPOS_SURUM.exe" dist/windows/AsilPOS-Kurulum.exe
          $sha = (Get-FileHash dist/windows/AsilPOS-Kurulum.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/windows/AsilPOS-Kurulum.exe.sha256", "$sha  AsilPOS-Kurulum.exe`n")
          $notes = "Kafedeki bilgisayara ilk kurulum için AsilPOS-Kurulum.exe'yi indirip çalıştırın (README: Windows'a kurulum). Kurulu kasa yeni sürümü kendiliğinden alır. Commit: $env:GITHUB_SHA"
          gh release create "v$env:ASILPOS_SURUM" dist/windows/AsilPOS-Kurulum.exe dist/windows/AsilPOS-Kurulum.exe.sha256 --target $env:GITHUB_SHA --title "AsilPOS $env:ASILPOS_SURUM" --notes $notes --latest
          $old = gh release list --limit 100 --json tagName,createdAt | ConvertFrom-Json | Sort-Object createdAt -Descending | Select-Object -Skip 10
          foreach ($r in $old) { gh release delete $r.tagName --yes --cleanup-tag }
