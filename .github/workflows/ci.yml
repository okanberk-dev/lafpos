# LafPOS sürekli entegrasyon: tip denetimi, birim testleri, üretim derlemesi ve gerçek tarayıcıda uçtan uca
# tarama (runner'daki Google Chrome ile; telefon, tablet, bilgisayar, küçük kasa bilgisayarı, koyu tema ve akışlar).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Aynı dalda yeni push gelince eski koşu iptal: Actions dakikası boşa gitmesin
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  denetim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ekranlar
          path: e2e/out/
          retention-days: 7
