    <!--
      Açılış ekranı (28 Kasım 2026): arayüzün betiği yüklenene dek #root'ta markalı ekran (zemin, AsilPOS simgesi ve adı).
      Dış kaynak yok (simge satır içi SVG, yazı sistemin yazısı); React ilk çizimde yerini alır (createRoot kabın içini
      siler). Zemin hemen, simge ve ad 150 ms sonra belirir: hızlı açılışta titreme olmaz, koyu temada açık zemin parlamaz.
      Tema uygulamanın kararıyla (src/lib/theme.ts, bootDark.ts): kayıtlı tema ya da cihazın teması; bar, çağrı ve müşteri
      ekranı kendi temasında. Betik yalnız açılış ekranının rengini seçer (data-acilis), uygulamanın temasını kurmaz
    -->
    <style>
      #acilis {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #eceef1;
        color: #171a26;
        font: 600 24px/1.2 'Segoe UI', system-ui, -apple-system, sans-serif;
        letter-spacing: -0.02em;
      }
      #acilis > * {
        animation: acilis-gel 0.24s ease-out 0.15s both;
      }
      #acilis svg {
        border-radius: 19px;
        box-shadow: 0 1px 2px rgb(13 63 48 / 0.25), 0 10px 28px rgb(13 63 48 / 0.16);
      }
      html[data-acilis='koyu'] #acilis {
        background: #050302;
        color: #fbfaf9;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-acilis]) #acilis {
          background: #050302;
          color: #fbfaf9;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #acilis > * {
          animation-duration: 1ms;
        }
      }
      @keyframes acilis-gel {
        from {
          opacity: 0;
        }
      }
    </style>
    <script>
      // Açılış ekranının rengi: uygulamanın ilk karedeki temasıyla aynı karar (theme.ts initTheme, bootDark.ts
      // bootThemeFor; tests/acilis-ekrani.test.ts iki kararı karşılaştırır)
      (function () {
        try {
          var oku = function (k) {
            try {
              return localStorage.getItem(k);
            } catch (e) {
              return null;
            }
          };
          var yol = location.pathname.replace(/\/+$/, '').replace(/^\/demo(?=\/|$)/, '') || '/';
          var koyu;
          if (yol === '/mutfak') koyu = oku('asilpos.pref.kds.tema') !== '"acik"';
          else if (yol === '/cagri') koyu = true;
          else if (yol === '/musteri-ekrani') {
            var son = null;
            try {
              son = JSON.parse(oku('asilpos.musteri-ekrani') || 'null');
            } catch (e) {
              son = null;
            }
            koyu = !(/[?&]tema=acik(&|$)/.test(location.search) || (son && son.theme === 'porselen'));
          } else {
            var tema = oku('asilpos.theme');
            koyu = tema === 'koyu' || (tema !== 'acik' && matchMedia('(prefers-color-scheme: dark)').matches);
          }
          document.documentElement.setAttribute('data-acilis', koyu ? 'koyu' : 'acik');
        } catch (e) {
          /* karar verilemedi: cihazın teması (yukarıdaki @media) */
        }
      })();
    </script>
